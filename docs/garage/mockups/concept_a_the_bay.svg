<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="monospace">
  <!-- Concept A: THE BAY — diegetic garage interior; stations ARE the menu -->
  <rect width="1280" height="720" fill="#08080c"/>

  <!-- back wall + roll-up door -->
  <rect x="0" y="0" width="1280" height="470" fill="#0c0c11"/>
  <rect x="440" y="60" width="400" height="330" fill="#101018" stroke="#2a2a33" stroke-width="4"/>
  <g stroke="#23232c" stroke-width="3">
    <line x1="448" y1="100" x2="832" y2="100"/><line x1="448" y1="140" x2="832" y2="140"/>
    <line x1="448" y1="180" x2="832" y2="180"/><line x1="448" y1="220" x2="832" y2="220"/>
    <line x1="448" y1="260" x2="832" y2="260"/><line x1="448" y1="300" x2="832" y2="300"/>
    <line x1="448" y1="340" x2="832" y2="340"/>
  </g>
  <!-- hazard stripe above the door -->
  <g>
    <rect x="440" y="44" width="400" height="12" fill="#ffd833"/>
    <g fill="#08080c">
      <rect x="452" y="44" width="16" height="12"/><rect x="484" y="44" width="16" height="12"/>
      <rect x="516" y="44" width="16" height="12"/><rect x="548" y="44" width="16" height="12"/>
      <rect x="580" y="44" width="16" height="12"/><rect x="612" y="44" width="16" height="12"/>
      <rect x="644" y="44" width="16" height="12"/><rect x="676" y="44" width="16" height="12"/>
      <rect x="708" y="44" width="16" height="12"/><rect x="740" y="44" width="16" height="12"/>
      <rect x="772" y="44" width="16" height="12"/><rect x="804" y="44" width="16" height="12"/>
    </g>
  </g>

  <!-- floor -->
  <rect x="0" y="470" width="1280" height="250" fill="#0f0f15"/>
  <line x1="0" y1="470" x2="1280" y2="470" stroke="#26262f" stroke-width="3"/>
  <ellipse cx="320" cy="560" rx="60" ry="12" fill="#0a0a0e"/>
  <ellipse cx="980" cy="600" rx="45" ry="9" fill="#0a0a0e"/>

  <!-- top bar -->
  <text x="28" y="34" fill="#ffd833" font-size="24" font-weight="bold">PIT STOP — MOE'S SALVAGE</text>
  <text x="920" y="34" fill="#8c949e" font-size="18">NEXT: SUBURBAN SLAUGHTER</text>
  <text x="1120" y="34" fill="#ffd833" font-size="22" font-weight="bold">⚙ 1,240</text>

  <!-- ============ STATION: ENGINE HOIST (upper-left) ============ -->
  <g>
    <polyline points="120,300 190,140 260,300" fill="none" stroke="#3a3a45" stroke-width="8"/>
    <line x1="190" y1="140" x2="190" y2="200" stroke="#565664" stroke-width="4" stroke-dasharray="6 6"/>
    <rect x="152" y="200" width="76" height="56" fill="#2e2e38" stroke="#565664" stroke-width="3"/>
    <rect x="164" y="188" width="12" height="12" fill="#565664"/><rect x="186" y="188" width="12" height="12" fill="#565664"/>
    <rect x="208" y="188" width="12" height="12" fill="#565664"/>
    <text x="130" y="336" fill="#8c949e" font-size="16">ENGINE</text>
  </g>

  <!-- ============ STATION: TIRE RACK (left wall) ============ -->
  <g>
    <rect x="60" y="380" width="150" height="180" fill="none" stroke="#3a3a45" stroke-width="6"/>
    <line x1="60" y1="440" x2="210" y2="440" stroke="#3a3a45" stroke-width="6"/>
    <line x1="60" y1="500" x2="210" y2="500" stroke="#3a3a45" stroke-width="6"/>
    <circle cx="98" cy="412" r="22" fill="#1a1a20" stroke="#565664" stroke-width="6"/>
    <circle cx="150" cy="412" r="22" fill="#1a1a20" stroke="#565664" stroke-width="6"/>
    <circle cx="98" cy="472" r="22" fill="#1a1a20" stroke="#565664" stroke-width="6"/>
    <circle cx="150" cy="472" r="22" fill="#1a1a20" stroke="#565664" stroke-width="6"/>
    <circle cx="124" cy="532" r="22" fill="#1a1a20" stroke="#565664" stroke-width="6"/>
    <text x="72" y="592" fill="#8c949e" font-size="16">SUSPENSION</text>
  </g>

  <!-- ============ STATION: ELECTRONICS SHELF (upper-right) ============ -->
  <g>
    <rect x="1010" y="200" width="180" height="10" fill="#3a3a45"/>
    <rect x="1010" y="270" width="180" height="10" fill="#3a3a45"/>
    <rect x="1030" y="160" width="8" height="40" fill="#565664"/>
    <path d="M 1014 200 A 26 26 0 0 1 1062 200" fill="none" stroke="#565664" stroke-width="5"/>
    <rect x="1090" y="172" width="44" height="28" fill="#2e2e38" stroke="#565664" stroke-width="3"/>
    <rect x="1148" y="236" width="30" height="34" fill="#2e2e38" stroke="#565664" stroke-width="3"/>
    <circle cx="1120" cy="252" r="16" fill="none" stroke="#565664" stroke-width="4"/>
    <line x1="1120" y1="252" x2="1132" y2="242" stroke="#565664" stroke-width="4"/>
    <text x="1058" y="306" fill="#8c949e" font-size="16">CPU</text>
  </g>

  <!-- ============ STATION: WEAPONS BENCH (right wall) — SELECTED ============ -->
  <g>
    <rect x="960" y="366" width="250" height="230" fill="none" stroke="#ffd833" stroke-width="4"/>
    <rect x="984" y="470" width="200" height="16" fill="#3a3a45"/>
    <rect x="994" y="486" width="12" height="80" fill="#3a3a45"/><rect x="1162" y="486" width="12" height="80" fill="#3a3a45"/>
    <!-- missile on the bench -->
    <rect x="1010" y="446" width="110" height="18" fill="#2e2e38" stroke="#565664" stroke-width="3"/>
    <polygon points="1120,446 1146,455 1120,464" fill="#bf3333"/>
    <polygon points="1010,446 996,440 1010,455" fill="#565664"/>
    <!-- ammo crate -->
    <rect x="1096" y="500" width="66" height="46" fill="#1f6f3a" stroke="#0d4020" stroke-width="4"/>
    <text x="1112" y="531" fill="#0d4020" font-size="20" font-weight="bold">M</text>
    <text x="1006" y="586" fill="#ffd833" font-size="17" font-weight="bold">&gt; WEAPONS &lt;</text>
  </g>

  <!-- ============ STATION: THE COUNTER (bottom-left) ============ -->
  <g>
    <rect x="280" y="540" width="140" height="70" fill="#16161c" stroke="#3a3a45" stroke-width="4"/>
    <rect x="306" y="508" width="56" height="32" fill="#2e2e38" stroke="#565664" stroke-width="3"/>
    <text x="322" y="530" fill="#ffd833" font-size="16" font-weight="bold">⚙</text>
    <text x="292" y="638" fill="#8c949e" font-size="16">LEDGER</text>
  </g>

  <!-- ============ THE CAR ON THE LIFT (center) ============ -->
  <g>
    <rect x="500" y="430" width="280" height="14" fill="#3a3a45"/>
    <rect x="516" y="444" width="18" height="60" fill="#2a2a33"/><rect x="746" y="444" width="18" height="60" fill="#2a2a33"/>
    <g stroke="#ffd833" stroke-width="3"><line x1="516" y1="454" x2="534" y2="454"/><line x1="746" y1="454" x2="764" y2="454"/></g>
    <!-- warpig silhouette, side view -->
    <rect x="524" y="376" width="232" height="44" fill="#1f6f3a" stroke="#0d4020" stroke-width="4"/>
    <rect x="576" y="344" width="118" height="36" fill="#1f6f3a" stroke="#0d4020" stroke-width="4"/>
    <rect x="588" y="352" width="40" height="22" fill="#0d1a10"/>
    <rect x="640" y="352" width="40" height="22" fill="#0d1a10"/>
    <circle cx="576" cy="424" r="26" fill="#14141a" stroke="#565664" stroke-width="6"/>
    <circle cx="706" cy="424" r="26" fill="#14141a" stroke="#565664" stroke-width="6"/>
    <rect x="748" y="386" width="22" height="10" fill="#8c949e"/>
    <text x="560" y="326" fill="#ccd1d9" font-size="17">WAR PIG — BIG SARGE</text>
  </g>

  <!-- installed-parts pips under the car -->
  <text x="512" y="528" fill="#8c949e" font-size="14">INSTALLED: [ENG 1] [OFFROAD TIRES] [—] [—] [—]</text>

  <!-- ============ ITEM STRIP (bottom panel) ============ -->
  <rect x="20" y="652" width="1240" height="56" fill="#121218" stroke="#ffd833" stroke-width="3"/>
  <text x="40" y="676" fill="#ccd1d9" font-size="17" font-weight="bold">MG COOLING ........ 400 ⚙</text>
  <text x="360" y="676" fill="#8c949e" font-size="15">slower heat, faster cool-off — "runs cold, shoots long"</text>
  <text x="1024" y="676" fill="#ffd833" font-size="15">[ENTER] INSTALL</text>
  <text x="40" y="698" fill="#565664" font-size="13">A/D walk stations    W/S browse bench    ESC keep rollin' →</text>
  <text x="1024" y="698" fill="#565664" font-size="13">1 of 3 in stock</text>
</svg>
